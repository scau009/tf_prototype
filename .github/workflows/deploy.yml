name: Deploy

# prod 分支推送（或手动触发）→ 自动构建整站并部署到 Cloudflare Workers
on:
  push:
    branches: [prod]
  workflow_dispatch:

# 同一时间只保留一个部署，新的推送取消进行中的旧部署
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署到 Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4 # 版本读取 package.json 的 packageManager 字段

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（部署闸门）
        run: pnpm typecheck

      - name: 构建整站（hub → 根，原型 → /<id>/）
        run: pnpm build:site

      - name: 部署到 Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
